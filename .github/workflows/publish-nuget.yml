name: Publish NuGet package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  pack:
    name: Build and pack
    runs-on: ${{ vars.NUGET_RUNNER || 'xcode-27' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Derive package version from tag
        id: version
        run: |
          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Tag '$TAG' is not a valid version tag. Expected vMAJOR.MINOR.PATCH with an optional SemVer prerelease suffix, e.g. v0.1.0 or v0.1.0-preview.1." >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.403"

      - name: Install .NET MAUI iOS workload
        run: dotnet workload install maui-ios --version 10.0.402.1

      - name: Build demo
        run: dotnet build DuoExtensions-Demo/DuoExtensions-Demo.csproj -c Release

      - name: Pack library
        run: >-
          dotnet pack DuoExtensions.Maui/DuoExtensions.Maui.csproj
          -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish to nuget.org
    needs: pack
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write # required for OIDC-based Trusted Publishing on nuget.org
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: artifacts

      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived
      # (~1 hour, single-use) nuget.org API key. No long-lived key is stored.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # --skip-duplicate keeps re-runs of this job idempotent if a previous
      # attempt already pushed the package.
      - name: Push package
        run: >-
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
